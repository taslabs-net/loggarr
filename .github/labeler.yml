# Configuration for actions/labeler
# Labels PRs based on file paths changed

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**/*'

docker:
  - changed-files:
      - any-glob-to-any-file:
          - 'Dockerfile'
          - 'Dockerfile.*'
          - 'docker-compose*.yml'
          - '.dockerignore'

config:
  - changed-files:
      - any-glob-to-any-file:
          - '*.toml'
          - '*.yaml'
          - '*.yml'
          - '*.json'
          - '!package*.json'
          - '!docker-compose*.yml'

source:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*'
          - 'lib/**/*'
          - 'pkg/**/*'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'
          - 'pnpm-lock.yaml'
          - 'yarn.lock'
          - 'go.mod'
          - 'go.sum'
          - 'Cargo.toml'
          - 'Cargo.lock'
          - 'requirements.txt'
          - 'pyproject.toml'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*_test.*'
          - '**/*.test.*'
          - '**/*_spec.*'
          - '**/*.spec.*'
          - 'tests/**/*'
          - '__tests__/**/*'
