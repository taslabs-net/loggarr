name: ESLint

on:
  workflow_call:

jobs:
  eslint:
    name: ESLint
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: |
          set -o pipefail
          echo "## ESLint Results" >> $GITHUB_STEP_SUMMARY
          if pnpm lint 2>&1 | tee output.txt; then
            echo "No linting errors found" >> $GITHUB_STEP_SUMMARY
          else
            echo "Linting errors detected:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
