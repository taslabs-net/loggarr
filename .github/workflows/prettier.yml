name: Prettier

on:
  workflow_call:

jobs:
  prettier:
    name: Prettier
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: |
          set -o pipefail
          echo "## Prettier Results" >> $GITHUB_STEP_SUMMARY
          if pnpm format:check 2>&1 | tee output.txt; then
            echo "All files are properly formatted" >> $GITHUB_STEP_SUMMARY
          else
            echo "Formatting issues detected:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run \`pnpm format\` to fix." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
