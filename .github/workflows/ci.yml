name: CI

on:
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeCheck
    uses: ./.github/workflows/typecheck.yml

  eslint:
    name: ESLint
    uses: ./.github/workflows/eslint.yml

  prettier:
    name: Prettier
    uses: ./.github/workflows/prettier.yml

  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build:
    name: Build
    needs: [typecheck, eslint, prettier, test]
    uses: ./.github/workflows/build.yml
