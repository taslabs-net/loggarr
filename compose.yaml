services:
  loggarr:
    image: ghcr.io/taslabs-net/loggarr:latest
    ports:
      - '9797:9797'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/app/data
    environment:
      - PORT=9797
      - LOG_BUFFER_MAX=1000
      - LOG_TAIL_LINES=10
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9797/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
